<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>뜨개 카운터</title>

        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, sans-serif;
                padding: 20px;
                text-align: center;
            }

            h1 {
                font-size: 24px;
            }

            .title-box {
                margin-bottom: 40px;
            }

            .label {
                font-size: 18px;
                text-align: left;
                margin-left: 5%;
            }

            input {
                width: 90%;
                padding: 12px;
                font-size: 18px;
                margin: 8px 0 20px;
            }

            .pattern {
                font-size: 24px;
                margin: 40px 0;
                display: flex;
                justify-content: center;
                gap: 8px;
                flex-wrap: wrap;
            }

            .active {
                border-bottom: 5px solid teal;
                padding-bottom: 4px;
                font-size: 24px;
            }

            .buttonWrap {
                display: flex;
                justify-content: center;
                gap: 15px;
            }

            button {
                font-size: 22px;
                padding: 18px 35px;
                border-radius: 15px;
                border: none;
                color: white;
            }

            .prev {
                background: #999;
            }

            .next {
                background: black;
            }
        </style>
    </head>

    <body>
        <div class="title-box">
            <h1>🧶 소나의 뜨개 카운터</h1>
            <h10>소피후드를 향해~~ </h10>
        </div>

        <div class="label">사이클</div>

        <input id="patternInput" value="1-2-3-4-3-4-3-4" />

        <div class="label">코</div>

        <input id="stitchInput" type="number" value="1" />

        <div class="pattern" id="patternView"></div>

        <div class="buttonWrap">
            <button class="prev" onclick="prev()">이전</button>

            <button id="mainButton" class="next" onclick="buttonClick()">다음</button>
        </div>

        <script>
            let pattern = [];

            let index = 0;

            let cycle = 1;

            let stitch = 1;

            let editing = false;

            function loadPattern() {
                pattern = document.getElementById('patternInput').value.split('-');

                render();
            }

            function render() {
                let html = '';

                pattern.forEach((num, i) => {
                    if (i === index) {
                        html += `
<span class="active">
${num}
</span>
`;
                    } else {
                        html += `
<span>
${num}
</span>
`;
                    }

                    if (i < pattern.length - 1) {
                        html += '-';
                    }
                });

                document.getElementById('patternView').innerHTML = html;
            }

            function buttonClick() {
                // 저장 모드

                if (editing) {
                    pattern = document.getElementById('patternInput').value.split('-');

                    index = 0;

                    cycle = 1;

                    stitch = 1;

                    document.getElementById('stitchInput').value = 1;

                    editing = false;

                    document.getElementById('mainButton').innerText = '다음';

                    render();

                    return;
                }

                next();
            }

            function next() {
                index++;

                if (index >= pattern.length) {
                    index = 0;

                    cycle++;

                    stitch++;

                    document.getElementById('stitchInput').value = stitch;
                }

                render();
            }

            function prev() {
                index--;

                if (index < 0) {
                    index = pattern.length - 1;

                    if (cycle > 1) {
                        cycle--;

                        stitch--;
                    }
                }

                document.getElementById('stitchInput').value = stitch;

                render();
            }

            // 사이클 수정

            document.getElementById('patternInput').addEventListener('input', () => {
                editing = true;

                document.getElementById('mainButton').innerText = '저장';
            });

            // 코 직접 수정

            document.getElementById('stitchInput').addEventListener('change', (e) => {
                stitch = Number(e.target.value);

                render();
            });

            loadPattern();
        </script>
    </body>
</html>
