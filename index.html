<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>뜨개 카운터</title>

        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, sans-serif;
                padding: 20px;
                text-align: center;
            }

            .title-box {
                margin-bottom: 40px;
            }

            h1 {
                font-size: 24px;
            }

            .label {
                text-align: left;
                margin-left: 5%;
                font-size: 16px;
            }

            input {
                width: 90%;
                padding: 12px;

                font-size: 18px;

                border-radius: 12px;

                border: 1px solid #ddd;

                margin: 8px 0 20px;
            }

            .pattern {
                font-size: 24px;

                margin: 40px 0;

                display: flex;

                justify-content: center;

                gap: 8px;

                flex-wrap: wrap;
            }

            .active {
                border-bottom: 5px solid teal;

                padding-bottom: 4px;
            }

            .buttonWrap {
                display: flex;

                gap: 10px;
            }

            button {
                border: none;

                border-radius: 14px;

                color: white;

                font-size: 18px;

                padding: 16px;
            }

            .prev {
                background: #999;

                flex: 1;
            }

            .next {
                background: #111;

                flex: 1;
            }

            .reset {
                margin-top: 20px;

                background: #e74c3c;

                font-size: 14px;

                padding: 12px 24px;
            }

            .direction {
                margin-top: 20px;

                width: 100%;

                background: white;

                color: #333;

                border: 1px solid #ddd;
            }
        </style>
    </head>

    <body>
        <div class="title-box">
            <h1>🧶 소나의 뜨개 카운터</h1>

            <div>소피후드를 향해~~</div>
        </div>

        <div class="label">사이클</div>

        <input id="patternInput" value="1-2-3-4-3-4-3-4" />

        <div class="label">코</div>

        <input id="stitchInput" type="number" value="1" />

        <div class="pattern" id="patternView"></div>

        <div class="buttonWrap">
            <button class="prev" onclick="prev()">이전</button>

            <button id="mainButton" class="next" onclick="mainAction()">다음</button>
        </div>

        <button id="directionButton" class="direction" onclick="toggleDirection()">▲ 코 오름차순</button>

        <br />

        <button class="reset" onclick="reset()">리셋</button>

        <script>
            let pattern = [];

            let index = 0;

            let cycle = 1;

            let stitch = 1;

            // true 증가 / false 감소

            let ascending = true;

            let editing = false;

            function loadPattern() {
                pattern = document.getElementById('patternInput').value.split('-');

                render();
            }

            function render() {
                let html = '';

                pattern.forEach((num, i) => {
                    if (i === index) {
                        html += `

<span class="active">
${num}
</span>

`;
                    } else {
                        html += `

<span>
${num}
</span>

`;
                    }

                    if (i < pattern.length - 1) {
                        html += '-';
                    }
                });

                document.getElementById('patternView').innerHTML = html;
            }

            function mainAction() {
                if (editing) {
                    pattern = document.getElementById('patternInput').value.split('-');

                    editing = false;

                    document.getElementById('mainButton').innerText = '다음';

                    render();

                    return;
                }

                next();
            }

            function next() {
                index++;

                if (index >= pattern.length) {
                    index = 0;

                    cycle++;

                    if (ascending) {
                        stitch++;
                    } else {
                        stitch--;
                    }

                    document.getElementById('stitchInput').value = stitch;
                }

                render();
            }

            function prev() {
                index--;

                if (index < 0) {
                    index = pattern.length - 1;

                    if (cycle > 1) {
                        cycle--;

                        if (ascending) {
                            stitch--;
                        } else {
                            stitch++;
                        }
                    }
                }

                document.getElementById('stitchInput').value = stitch;

                render();
            }

            function toggleDirection() {
                ascending = !ascending;

                document.getElementById('directionButton').innerText = ascending ? '▲ 코 오름차순' : '▼ 코 내림차순';
            }

            function reset() {
                index = 0;

                cycle = 1;

                stitch = 1;

                ascending = true;

                editing = false;

                document.getElementById('patternInput').value = '';

                document.getElementById('stitchInput').value = 1;

                document.getElementById('mainButton').innerText = '다음';

                document.getElementById('directionButton').innerText = '▲ 오름차순';

                pattern = [];

                render();
            }

            // 사이클 수정 감지

            document.getElementById('patternInput').addEventListener('input', () => {
                editing = true;

                if (pattern.length === 0) {
                    document.getElementById('mainButton').innerText = '저장';
                } else {
                    document.getElementById('mainButton').innerText = '수정';
                }
            });

            // 코 수정 감지

            document.getElementById('stitchInput').addEventListener('input', () => {
                editing = true;

                if (pattern.length === 0) {
                    document.getElementById('mainButton').innerText = '저장';
                } else {
                    document.getElementById('mainButton').innerText = '수정';
                }
            });

            loadPattern();
        </script>
    </body>
</html>
